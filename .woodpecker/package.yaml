when:
  event: [push, tag]
  path: ["slidgram/**/*", "pyproject.toml", "README.md"]

variables:
  - &ci-image codeberg.org/${CI_REPO_OWNER}/slidgram:ci
  - &only-main-tag
    when:
      branch: main
      event: tag

clone:
  - name: clone-deep
    image: woodpeckerci/plugin-git
    settings:
      tags: true
      partial: false

steps:
  changelog:
    image: codeberg.org/slidge/woodpecker-generate-changelog
    pull: true

  build:
    image: *ci-image
    commands:
      - uv build

  codeberg-pypi:
    when:
      event: [push, tag]
    image: *ci-image
    depends_on: build
    environment:
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
    commands:
      - uv publish --index codeberg --token $CODEBERG_TOKEN

  pypi:
    image: *ci-image
    depends_on: build
    <<: *only-main-tag
    environment:
      PYPI_TOKEN:
        from_secret: PYPI_TOKEN
    commands:
      - uv publish --token $PYPI_TOKEN

  codeberg-release:
    image: woodpeckerci/plugin-release
    depends_on: [changelog, build]
    <<: *only-main-tag
    settings:
      files:
        - dist/slidgram*
      api_key:
        from_secret: CODEBERG_TOKEN
      note: CHANGELOG
