<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{filename}</title>
    <style>
        body {{ background-color: #121212; color: #ffffff; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }}
        img, video {{ max-width: 100%; max-height: 70vh; object-fit: contain; margin-bottom: 20px; }}
        .btn {{ display: inline-block; padding: 15px 30px; background-color: #0088cc; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; width: 80%; max-width: 300px; }}
        .btn:hover {{ background-color: #006699; }}
        .btn-secondary {{ background-color: #333333; }}
        .btn-secondary:hover {{ background-color: #555555; }}
        .container {{ display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }}
    </style>
</head>
<body>
    <div class="container">
        <h3>{filename}</h3>
        <img src="{file_url_proxy}" alt="Media" onerror="this.style.display='none';">
        <a href="{file_url_proxy}" class="btn" download="{filename}">Скачать сжатый</a>
        <a href="{file_url_orig}" class="btn btn-secondary" download="{filename}">Скачать оригинал ({formatted_size})</a>
    </div>
</body>
</html>
